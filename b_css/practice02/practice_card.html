  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    section {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: space-between;
    }

    .card {
      width: 300px;
      height: 400px;
      background-color: white;
      border-radius: 10px;
      margin: 10px;

      transition: all 0.3s ease-in-out;

      /* 
      지정된 너비와 높이값 + radius를 제외한 영역을 숨김 처리
      넘치는 부분을 숨겨줌.
      */
      overflow: hidden;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .card img {
      width: 100%;
      height: 200px;
    }

    .card-content {
      padding: 20px;
    }

    .card-title {
      font-size: 20px;
      margin: 0;
    }

    .card-text {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
